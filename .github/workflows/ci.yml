name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configure git (self_update tests create scratch repos)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - name: Byte-compile all scripts
        run: python -m compileall -q scripts

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Every script must answer --help without optional deps
        run: |
          rc=0
          for f in scripts/*.py; do
            if python "$f" --help >/dev/null 2>&1; then
              echo "ok   $f"
            else
              echo "FAIL $f"; rc=1
            fi
          done
          exit $rc

      - name: PII gate (no personal data may enter a public repo)
        run: python scripts/check_no_pii.py
